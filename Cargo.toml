[package]
name = "contact-api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
lettre = { version = "0.11.7", features = ["rustls-tls", "rustls-native-certs", "builder", "hostname", "pool", "smtp-transport"], default-features = false }
maplit = "1.0.2"
signal-hook = "0.3.17"
tokio = { version = "1.42.0", features = ["bytes", "full", "net"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dependencies.rustls]
version = "0.23.12"
default-features = false

[profile.release]
strip = true
opt-level = "s"
lto = true
panic = "abort"
